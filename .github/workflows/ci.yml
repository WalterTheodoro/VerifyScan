name: CI

on:
  push:
  pull_request:

# Uma execução por branch: push seguido cancela o anterior em vez de enfileirar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ruff, mypy, pytest e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres de teste para os testes marcados `integracao` (CLAUDE.md §6). Mesma versão do
    # docker compose e do Neon (ADR-0011). Credenciais descartáveis: o banco só existe durante
    # o job e não é alcançável de fora do runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verifyscan
          POSTGRES_PASSWORD: verifyscan_ci
          POSTGRES_DB: verifyscan_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifyscan -d verifyscan_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Sem o driver de propósito, como vem do Neon: exercita a normalização do Settings.
      DATABASE_URL: postgresql://verifyscan:verifyscan_ci@localhost:5432/verifyscan_teste
      TEST_DATABASE_URL: postgresql://verifyscan:verifyscan_ci@localhost:5432/verifyscan_teste
      # Os dois segredos da fatia 10 não têm default, e o Alembic lê o Settings (ADR-0024).
      # Valores do CI, públicos de propósito: não protegem nada fora deste runner.
      IP_HMAC_SEGREDO: segredo-publico-do-ci-nao-e-segredo-0123456789
      PROXY_SEGREDO: segredo-publico-do-ci-nao-e-segredo-9876543210
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        # --frozen falha se o uv.lock estiver desatualizado em relação ao pyproject.toml,
        # em vez de resolver de novo e testar algo diferente do que roda na máquina.
        run: uv sync --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check
        # Falha se os modelos e as migrações divergirem: é o que garante "esquema só por
        # Alembic". Limite conhecido: o autogenerate não compara CHECK constraint.
        run: uv run alembic check

      - name: pytest
        # Os testes unitários não tocam em Postgres nem em Redis: as dependências entram por
        # `Depends` e são substituídas por falsos determinísticos. Só os marcados `integracao`
        # falam com o Postgres do serviço acima; eles refazem o esquema pelo Alembic
        # (downgrade base → upgrade head) e não deixam linha para trás.
        #
        # Com cobertura de `app/` (ADR-0025): reprova abaixo do `fail_under` do pyproject.toml
        # (75%, a meta da disciplina). Aqui os de integração rodam, então contam na medida.
        run: uv run pytest -q -rs --cov=app --cov-report=term-missing

  frontend:
    name: frontend — eslint, tsc, testes e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tipos das rotas
        # O `tsc` precisa dos tipos que o Next gera (`LayoutProps`, em `.next/types`): num checkout
        # limpo eles não existem. O `typegen` lê o `next.config.ts`, que em produção exige estas
        # duas variáveis. Valores do CI, públicos de propósito: não protegem nada fora deste runner.
        env:
          API_URL_INTERNA: http://localhost:8000
          PROXY_SEGREDO: segredo-publico-do-ci-nao-e-segredo-9876543210
        run: npx next typegen

      - name: tsc
        # Além dos erros de tipo, é a trava das opções do Sentry (ADR-0026): elas passam por
        # `satisfies`, e uma opção que o SDK não conhece reprova aqui.
        run: npx tsc --noEmit

      - name: testes e cobertura
        # Mesmo comando da máquina e da prova de autoria (ADR-0025): Vitest com cobertura de
        # `app/**` inteiro. Reprova se as linhas cobertas ficarem abaixo do threshold do
        # vitest.config.ts (25%, a meta da disciplina).
        run: npm test

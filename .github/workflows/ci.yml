name: CI

on:
  push:
  pull_request:

# Uma execução por branch: push seguido cancela o anterior em vez de enfileirar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ruff, mypy, pytest e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres de teste para os testes marcados `integracao` (CLAUDE.md §6). Mesma versão do
    # docker compose e do Neon (ADR-0011). Credenciais descartáveis: o banco só existe durante
    # o job e não é alcançável de fora do runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verifyscan
          POSTGRES_PASSWORD: verifyscan_ci
          POSTGRES_DB: verifyscan_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifyscan -d verifyscan_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Sem o driver de propósito, como vem do Neon: exercita a normalização do Settings.
      DATABASE_URL: postgresql://verifyscan:verifyscan_ci@localhost:5432/verifyscan_teste
      TEST_DATABASE_URL: postgresql://verifyscan:verifyscan_ci@localhost:5432/verifyscan_teste
      # Os dois segredos da fatia 10 não têm default, e o Alembic lê o Settings (ADR-0024).
      # Valores do CI, públicos de propósito: não protegem nada fora deste runner.
      IP_HMAC_SEGREDO: segredo-publico-do-ci-nao-e-segredo-0123456789
      PROXY_SEGREDO: segredo-publico-do-ci-nao-e-segredo-9876543210
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        # Action de terceiro: presa pelo commit, não pela tag, que pode ser movida (ADR-0027).
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject.toml, em vez
        # de resolver de novo e testar algo diferente do que roda na máquina. (O --frozen, usado
        # antes, não confere isso: só usa o lock como está.) Os `uv run` abaixo levam o mesmo
        # --locked, porque sem ele cada um poderia resolver de novo.
        run: uv sync --locked

      - name: ruff format
        run: uv run --locked ruff format --check .

      - name: ruff check
        run: uv run --locked ruff check .

      - name: mypy
        run: uv run --locked mypy app

      - name: alembic upgrade head
        run: uv run --locked alembic upgrade head

      - name: alembic check
        # Falha se os modelos e as migrações divergirem: é o que garante "esquema só por
        # Alembic". Limite conhecido: o autogenerate não compara CHECK constraint.
        run: uv run --locked alembic check

      - name: pytest
        # Os testes unitários não tocam em Postgres nem em Redis: as dependências entram por
        # `Depends` e são substituídas por falsos determinísticos. Só os marcados `integracao`
        # falam com o Postgres do serviço acima; eles refazem o esquema pelo Alembic
        # (downgrade base → upgrade head) e não deixam linha para trás.
        #
        # Com cobertura de `app/` (ADR-0025): reprova abaixo do `fail_under` do pyproject.toml
        # (75%, a meta da disciplina). Aqui os de integração rodam, então contam na medida.
        #
        # O `coverage.xml` é o que o SonarQube Cloud lê (ADR-0027).
        run: uv run --locked pytest -q -rs --cov=app --cov-report=term-missing --cov-report=xml

      - name: Guardar o relatório de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: frontend — eslint, tsc, testes e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        # Sem os scripts de instalação dos pacotes: lint, tsc, testes e build passam sem eles
        # (conferido em 25/11/2026), e código de pacote não roda na instalação.
        run: npm ci --ignore-scripts

      - name: eslint
        run: npm run lint

      - name: tipos das rotas
        # O `tsc` precisa dos tipos que o Next gera (`LayoutProps`, em `.next/types`): num checkout
        # limpo eles não existem. O `typegen` lê o `next.config.ts`, que em produção exige estas
        # duas variáveis. O --no-install garante que o `npx` só usa o que o `npm ci` instalou, sem
        # baixar nada. Valores do CI, públicos de propósito: não protegem nada fora deste runner.
        env:
          API_URL_INTERNA: http://localhost:8000
          PROXY_SEGREDO: segredo-publico-do-ci-nao-e-segredo-9876543210
        run: npx --no-install next typegen

      - name: tsc
        # Além dos erros de tipo, é a trava das opções do Sentry (ADR-0026): elas passam por
        # `satisfies`, e uma opção que o SDK não conhece reprova aqui.
        run: npx --no-install tsc --noEmit

      - name: testes e cobertura
        # Mesmo comando da máquina e da prova de autoria (ADR-0025): Vitest com cobertura de
        # `app/**` e do código da raiz (ADR-0027). Reprova se as linhas cobertas ficarem abaixo do threshold do
        # vitest.config.ts (25%, a meta da disciplina). Gera também o `coverage/lcov.info`, que o
        # SonarQube Cloud lê (ADR-0027).
        run: npm test

      - name: Guardar o relatório de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  cadeia-de-ip:
    name: infra — cadeia de IP da cota
    runs-on: ubuntu-latest
    # Sobe a pilha de produção inteira (Caddy, frontend, backend e Postgres) com o compose.yml e
    # o Caddyfile de verdade, e confere de fora que um X-Forwarded-For forjado não muda a chave
    # da cota e que o IP real chega ao backend (ADR-0029). O que muda em relação à VM está em
    # infra/teste-ip/compose.teste.yml: imagens construídas aqui, só HTTP e IA desligada.
    env:
      # Os mesmos arquivos em todos os passos, sem repetir -p, -f e --env-file em cada comando.
      COMPOSE_PROJECT_NAME: verifyscan-teste-ip
      COMPOSE_FILE: infra/compose.yml:infra/teste-ip/compose.teste.yml
      COMPOSE_ENV_FILES: infra/teste-ip/teste.env
    steps:
      - uses: actions/checkout@v4

      - name: Construir as imagens
        run: docker compose build

      - name: Subir o banco e rodar a migração
        # A mesma ordem do deploy: a migração roda com a imagem do backend, antes de ele subir.
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm backend alembic upgrade head

      - name: Subir a pilha
        # --wait só volta com backend e frontend saudáveis (o /health pela cadeia inteira).
        run: docker compose up -d --wait

      - name: IP forjado não muda a chave da cota
        run: docker compose exec -T cliente-a python /teste/cadeia_de_ip.py forjar

      - name: Outro IP real tem outra chave
        # Depois do passo acima, nesta ordem: o primeiro cliente já esgotou o limite do IP dele.
        run: docker compose exec -T cliente-b python /teste/cadeia_de_ip.py outro-ip

      - name: Logs, se falhou
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Derrubar
        if: always()
        run: docker compose down -v

  sonar:
    name: sonar — análise estática
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # PR vindo de fork não recebe o SONAR_TOKEN: o job é pulado em vez de falhar.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: o Sonar usa o `git blame` para saber o que é código novo.
          fetch-depth: 0

      - name: Baixar a cobertura do backend
        uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend

      - name: Baixar a cobertura do frontend
        uses: actions/download-artifact@v8
        with:
          name: cobertura-frontend
          path: frontend/coverage

      - name: Apontar o coverage.xml para este checkout
        # O relatório guarda o caminho absoluto de `backend/app` no runner que rodou os testes.
        # Reescrito aqui para o Sonar achar os arquivos mesmo se o caminho do runner mudar.
        run: sed -i "s#<source>.*</source>#<source>${GITHUB_WORKSPACE}/backend/app</source>#" backend/coverage.xml

      - name: Análise no SonarQube Cloud
        # Action de terceiro: presa pelo commit. v8.4.1, publicada em 03/11/2026 (ADR-0022).
        # Sem `sonar.qualitygate.wait`: o Quality Gate ainda não bloqueia o merge (ADR-0027).
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          # Desliga a configuração automática do scanner: ligada, ela ignora o que o
          # `sonar-project.properties` declara como fonte e como teste (ADR-0027). Vai na linha de
          # comando porque é onde a documentação garante que o valor vence o do projeto.
          args: -Dsonar.scanner.autoconfig.enabled=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

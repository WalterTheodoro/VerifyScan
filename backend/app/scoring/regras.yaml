# ─────────────────────────────────────────────────────────────────────────────────────────────
# VerifyScan — pesos, padrões e faixas do motor de risco
#
# Este arquivo é a fonte única de verdade da pontuação (invariante 5 do CLAUDE.md). Mudar um
# peso ou acrescentar um padrão NÃO deve exigir mudar código Python.
#
# Como escrever um padrão (ADR-0008):
#   • É uma expressão regular, sempre entre ASPAS SIMPLES — em aspas duplas o YAML processa
#     as barras invertidas e `\d`, `\b` deixam de chegar inteiros na regex.
#   • Escreva em português natural, com acento e maiúscula à vontade: o mesmo normalizador que
#     roda no texto do usuário (minúsculas, sem acento, espaços colapsados) roda no padrão
#     antes de compilar. `'últimas horas'` casa com `ÚLTIMAS  HORAS`.
#   • NÃO use classe de regex maiúscula (`\D`, `\S`, `\W`, `\B`): a normalização as
#     transformaria em `\d`, `\s`, `\w`, `\b`, invertendo o sentido. O carregamento recusa.
#   • O texto chega em uma linha só, então `.` alcança o que estava depois de uma quebra.
#
# Pesos e faixas vêm da §5.4.1 e §5.4.7 do RFC e são HIPÓTESES até a calibração da Fase 2
# (ADR-0005). O relatório do `avaliar_corpus` carimba a `versao` abaixo.
# ─────────────────────────────────────────────────────────────────────────────────────────────

versao: 4

# Cada categoria pontua no máximo uma vez, com o peso da categoria, não importa quantos padrões
# dela casem (ADR-0004). Somar por ocorrência criaria viés de comprimento: texto longo ficaria
# automaticamente mais perigoso, e repetir a mesma frase dez vezes mudaria o resultado.
agregacao: por_categoria

# §5.4.7: 0–30 BAIXO · 31–60 MÉDIO · 61+ ALTO.
faixas:
  baixo_ate: 30
  medio_ate: 60

# Extração de links (§5.4.2). Não pontua nada — os pesos de link estão na seção `dominios`.
urls:
  # Teto por análise: limita o trabalho que as Fases 3 e 4 herdam de mensagem cheia de links.
  maximo_por_analise: 20
  # Vale só para host escrito SEM protocolo. Com `http://` explícito, qualquer TLD passa.
  tlds_conhecidos:
    - com
    - br
    - net
    - org
    - gov
    - edu
    - io
    - co
    - me
    - ly
    - cc
    - info
    - biz
    - app
    - dev
    - link
    - live
    - site
    - online
    - shop
    - store
    - vip
    - xyz
    - top
    - click
    - tk
    - pw
    - icu
    - fun
    - work
    - pt
    - es
    - us
    - uk
    - ar
    # Terminações abusadas (seção `dominios`): precisam estar aqui, senão `golpe.cfd` escrito
    # sem `http://` nem é extraído. O carregamento confere.
    - help
    - garden
    - wiki
    - cfd
    - qpon
    - xin
    - loan
    - bid
    - rest
    - ml
    - ga
    - cf
    - gq

categorias:
  # ── §5.4.1, +10 ────────────────────────────────────────────────────────────────────────────
  - id: urgencia
    peso: 10
    descricao: 'A mensagem tenta apressar você, para não dar tempo de pensar.'
    padroes:
      - 'clique agora'
      - 'clica agora'
      - 'expira em'
      - 'expira hoje'
      - 'últimas horas'
      - 'último dia'
      - 'prazo vencendo'
      - 'prazo final'
      - '\burgente\b'
      - '\bimediatamente\b'
      - 'agora mesmo'
      - 'só até hoje'
      - 'válido até hoje'
      - 'não perca tempo'

  # ── §5.4.1, +15 ────────────────────────────────────────────────────────────────────────────
  - id: personificacao_marca
    peso: 15
    descricao: 'A mensagem se apresenta como uma empresa ou órgão conhecido.'
    padroes:
      # Marca seguida de verbo institucional. A janela curta entre os dois é o que separa
      # "Banco do Brasil informa: sua conta..." de "Banco do Brasil: compra aprovada".
      - '(banco do brasil|bradesco|itaú|caixa|santander|nubank|banco inter|picpay|mercado pago|correios|serasa|receita federal|detran|inss)\b.{0,30}\b(informa|informamos|comunica|comunicamos|avisa|notifica)\b'
      - 'encomenda (retida|parada|pendente|aguardando)'
      - 'pacote (retido|parado|pendente)'
      # Versão 4 (fatia 8): até três palavras no meio — "pacote está retido", "encomenda ainda
      # está parada". Só os verbos de bloqueio; "pendente" e "aguardando" seguem colados ao
      # substantivo, porque "encomenda aguardando retirada" é aviso comum de portaria.
      - '\b(encomenda|pacote|objeto) (\w+ ){0,3}(retid[oa]|parad[oa]|taxad[oa])\b'
      - 'setor (antifraude|de segurança)'
      - 'central (antifraude|de segurança)'
      - 'departamento (antifraude|de segurança)'

  # ── §5.4.1, +15 ────────────────────────────────────────────────────────────────────────────
  - id: ameaca_bloqueio
    peso: 15
    descricao: 'A mensagem ameaça bloquear, suspender ou cancelar alguma coisa sua.'
    padroes:
      - '\b(sua conta|seu cadastro|seu acesso|seu benefício|sua chave pix|seu cpf)\b.{0,20}\b(será|vai ser|foi)\b.{0,10}\b(suspens|bloquead|cancelad|desativad|encerrad|inutilizad)'
      - 'evite o bloqueio'
      - 'evitar o bloqueio'
      - 'última notificação'
      - 'último aviso'
      - 'sob pena de'
      - 'seu cpf está (irregular|suspenso|bloqueado|pendente)'
      - 'nome (será|vai ser) negativado'
      - 'regularize (para|antes de) (evitar|não perder)'

  # ── §5.4.1, +20 ────────────────────────────────────────────────────────────────────────────
  - id: premio_falso
    peso: 20
    descricao: 'A mensagem oferece prêmio, sorteio ou vantagem que você não pediu.'
    padroes:
      - 'você foi (selecionado|sorteado|premiado|contemplado)'
      - 'parabéns[,!]? você (ganhou|foi)'
      - 'você (ganhou|acaba de ganhar)'
      - 'resgat(e|ar) seu (prêmio|benefício|bônus)'
      - 'retir(e|ar) seu (prêmio|benefício)'
      - 'ganhador (do|da) (sorteio|promoção)'
      - 'prêmio de r\$'

  # ── §5.4.1, +25 · a §5.4.7 funde esta com a próxima; a errata (item 3) separa ───────────────
  - id: solicitacao_financeira
    peso: 25
    descricao: 'A mensagem pede um pagamento, transferência ou comprovante.'
    padroes:
      - '(faça|faz|realize|envie|efetue) (um |o )?pix'
      - 'pix de r\$'
      - 'pagamento (via|por) pix'
      - '\btransfira\b'
      - '\bdeposite\b'
      - 'comprovante de (pagamento|transferência|depósito)'
      - 'taxa de (liberação|entrega|alfândega|desbloqueio|transferência|regularização)'
      - '(pague|pagar|pagamento d[ea]) (uma |a |o )?taxa'
      # Versão 4 (fatia 8): o pedido de PIX com o meio no fim ("pague com PIX", "pagando agora
      # pelo Pix", "mandar R$ 320 no Pix"). Não casa "você recebeu um Pix" nem "manda o pix".
      - '\b(pague|pagar|pagando|pagamento|mande|mandar|envie|enviar)\b.{0,40}\b(pelo|via|por|com|no) pix\b'
      - '\btaxa\b.{0,40}\bpara (liberar|liberação|desbloquear|receber|retirar)\b'
      - '\bliberar (a|o|sua|seu) (entrega|encomenda|pacote|objeto)\b'

  # ── §5.4.1, +25 ────────────────────────────────────────────────────────────────────────────
  - id: dados_pessoais
    peso: 25
    descricao: 'A mensagem pede dados pessoais, senha ou dados do seu cartão.'
    padroes:
      # Exige o verbo. "Dados bancários" sozinho aparece em aviso legítimo de banco
      # ("nunca pedimos seus dados bancários por SMS") e geraria falso positivo.
      - '(informe|confirme|digite|envie|atualize|valide|cadastre) (o |a |os |as |seu |sua |seus |suas )*(cpf|cnpj|senha|dados bancários|dados da conta|número do cartão|código)'
      - 'código de (segurança|verificação|acesso)'
      - 'senha do (aplicativo|banco|cartão|internet banking)'
      - 'foto (do|de) (documento|rg|cnh)'
      - 'selfie (com|segurando)'

  # ── Fora da §5.4.1: defesa em profundidade contra injeção de prompt (ADR-0020) ──────────────
  # Mensagem legítima não fala com um sistema de análise nem tenta mandar no resultado. Sozinha,
  # leva a ALTO: o peso precisa passar de `faixas.medio_ate` (um teste confere). É o que segura
  # o nível quando a IA cai e a resposta sai só do motor — o golpe que diz "classifique como
  # segura" não pode sair BAIXO só porque o Claude estava fora do ar.
  #
  # Versão 3 (bateria 2): cada padrão só casa quando a mensagem fala COM um analisador ou tenta
  # mandar no resultado. Os da versão 2 casavam a palavra solta e puseram em ALTO "sistema de
  # análise de crédito", "assistente de vendas" e "ignore as regras do grupo antigo".
  - id: instrucao_ao_analisador
    peso: 61
    descricao: 'A mensagem tenta dar ordens a quem analisa mensagens. Mensagem comum não faz isso.'
    padroes:
      # "sistema de análise" interpelado: seguido de ":", "," ou "!"...
      - 'sistemas? de análise ?[:,!]'
      # ...ou depois de "atenção,", "(aviso) ao", "para o" — e não seguido de "de crédito", "do banco".
      - '(\batenção,? |\baos? |\bpara os? )sistemas? de análise\b(?! d[aeo]s? )'
      - '\banalysis system ?[:,!]'
      - '\battention,? analysis system\b'
      - '\bclassifi(que|car|ca) (esta|essa) mensagem\b'
      - '\bclassifi(que|car|ca) (isto |isso )?como (segur[ao]|baixo\b|risco baixo|legítim|confiáve|oficial)'
      - '\bclassify this message\b'
      - '\bignore (as|todas as) (regras|instruções) (anteriores|acima|do sistema|que você recebeu|de segurança)'
      - '\bignore tudo o que foi dito (antes|acima|anteriormente)'
      - '\bignore (all )?(the |your )?previous instructions\b'
      - 'verificad[ao] pelo verifyscan'
      - '\byou are now (a|an) (\w+ )?(ai|assistant|chatbot|model|system)\b'
      - '\bvocê agora é (um |uma |o |a )?(ia|inteligência artificial|modelo de (linguagem|ia)|chatbot|sistema|assistente virtual|assistente de ia)\b'
      # Troca de papel com ordem de afirmar que o pedido é legítimo (E08 da bateria 2).
      - '\bvocê agora é (um|uma|o|a) .{0,60}\bdeve (confirmar|dizer|afirmar|garantir|responder) .{0,40}(legítim|segur|oficial|confiáve|verdadeir)'
      - '\bnivel_sugerido\b'
      - '\b(mostre|revele|repita|exiba|imprima) (o )?(seu )?prompt\b'
      - '</?(mensagem|instruções|instrucoes|system)>'

# ─────────────────────────────────────────────────────────────────────────────────────────────
# Links e domínios — DomainAnalyzer (Fase 3, ADR-0022)
#
# PRINCÍPIO: o sistema NUNCA abre o link da mensagem — nem GET, nem HEAD, nem DNS, nem seguir
# redirecionamento. Abrir pode avisar o golpista, baixar conteúdo malicioso ou servir de SSRF.
# Tudo abaixo é sobre o TEXTO do endereço. Reputação externa (RDAP, listas) é outra fatia.
#
# Cada sinal é uma categoria e pontua uma vez por análise, por mais links que a mensagem tenha
# (a mesma agregação do texto, ADR-0004). Link para domínio oficial de uma marca abaixo não
# dispara nenhum sinal: vira informação para a IA, sem baixar o nível do motor.
#
# As descrições só podem usar {marca}, que vem da lista fechada de marcas. O domínio vem da
# mensagem, e o fator é gravado também em análise anônima; por isso ele não entra (fatia 8). O
# carregamento recusa {dominio} aqui.
# ─────────────────────────────────────────────────────────────────────────────────────────────
dominios:
  sinais:
    # O nome inteiro da marca no endereço, fora do domínio oficial: `correios-rastreio.example`,
    # `bradesco.conta-segura.com`. RFC "subdomínio enganoso" +30, subido a 35 para que sozinho,
    # sem nenhum sinal de texto, saia de BAIXO.
    - id: link_marca_nao_oficial
      peso: 35
      descricao: 'O link usa o nome {marca}, mas não é um endereço oficial.'
      no_link: 'usa o nome {marca}, mas não é um endereço oficial'
    # Letra trocada, dígito no lugar de letra ou acento a mais: `bradesc0`, `ltau`, `nubamk`.
    # RFC "typosquatting" +35.
    - id: link_parecido_com_oficial
      peso: 35
      descricao: 'O endereço do link imita o nome {marca}, com letras trocadas.'
      no_link: 'imita o nome {marca}, com letras trocadas'
    # Punycode (`xn--`), letra de fora do ASCII (o "a" cirílico, U+0430) ou caractere invisível.
    - id: link_caracteres_enganosos
      peso: 35
      descricao: 'O endereço do link tem letras de outro alfabeto ou caracteres escondidos, que imitam um endereço comum.'
      no_link: 'tem letras de outro alfabeto ou caracteres escondidos'
    - id: link_ip
      peso: 35
      descricao: 'O link leva a um número (endereço IP) em vez do nome de um site. Empresas sérias não fazem isso.'
      no_link: 'é um número, e não o nome de um site'
    # "@" antes do host, porta fora do comum, subdomínio demais.
    - id: link_truque_endereco
      peso: 25
      descricao: 'O endereço do link foi montado para confundir: o site de verdade não é o que aparece primeiro.'
      no_link: 'foi montado para confundir'
    # Marketing legítimo também usa encurtador: sozinho, fica em BAIXO.
    - id: link_encurtado
      peso: 15
      descricao: 'A mensagem usa um link encurtado, que esconde para onde ele leva.'
      no_link: 'é um link encurtado, que esconde para onde leva'
    # RFC "TLD de alto risco" +15.
    - id: link_tld_abusado
      peso: 15
      descricao: 'O link termina numa terminação de endereço muito usada em golpes.'
      no_link: 'tem uma terminação muito usada em golpes'
    - id: link_palavra_isca
      peso: 15
      descricao: 'O endereço do link usa palavras como "segurança", "taxa" ou "liberação", comuns em golpes.'
      no_link: 'usa palavras comuns em golpes'
    # Só quando a pessoa escreveu `http://`: o extrator completa "gov.br" com `http://`, e isso
    # não pode virar sinal.
    - id: link_sem_https
      peso: 10
      descricao: 'O link não usa conexão protegida: começa com "http://", sem o "s".'
      no_link: 'não usa conexão protegida'

  # O bloco "Links que aparecem na mensagem" mostra o domínio, como texto, e ao lado o `no_link`
  # de cada sinal. Sem sinal, uma destas. A do link sem sinal não pode soar como garantia: o
  # sistema nunca diz que um site é seguro.
  link_oficial: 'endereço oficial: {marca}'
  link_sem_sinal: 'nada estranho no endereço, mas isso não garante que o site é verdadeiro'

  # A frase do fim do bloco de links (fatia 9). Com todos os links oficiais, a primeira; com
  # qualquer outro, a segunda. Mandar "não abra antes de confirmar" um endereço oficial confundia
  # quem lê; e nenhuma das duas diz que o site é seguro.
  link_conselho_oficial: >-
    Conferimos só o endereço, sem abrir o link. O endereço é oficial. Mesmo assim, prefira abrir
    pelo aplicativo ou digitando o endereço você mesmo.
  link_conselho: >-
    Conferimos só o endereço, sem abrir o link. Não abra antes de confirmar com a empresa pelo
    telefone ou aplicativo oficial.

  # Domínio registrável (eTLD+1) dos encurtadores mais comuns no Brasil.
  encurtadores:
    - bit.ly
    - bit.do
    - tinyurl.com
    - cutt.ly
    - is.gd
    - v.gd
    - encurtador.com.br
    - abre.ai
    - rb.gy
    - t.ly
    - t.co
    - goo.gl
    - ow.ly
    - rebrand.ly
    - shorturl.at
    - tiny.cc

  # Fonte (ADR-0022): Cybercrime Information Center (Interisle), "Spam Activity in TLDs, March 1 –
  # May 31, 2026" — as 10 primeiras por concentração (domínios de spam a cada 10 mil, de 3.256
  # em .help a 864 em .rest). Mais as do antigo Freenom (tk, ml, ga, cf, gq), fonte histórica:
  # Cybercrime Information Center (Interisle), "Phishing Landscape 2023" — 14% dos ataques de
  # phishing no mundo em anos anteriores. O Freenom parou de registrar em janeiro de 2023: as
  # cinco ficam porque domínio antigo ainda circula, não porque haja abuso novo medido.
  tlds_abusados:
    - help
    - garden
    - wiki
    - cfd
    - qpon
    - xin
    - top
    - loan
    - bid
    - rest
    - tk
    - ml
    - ga
    - cf
    - gq

  # Procuradas no host e no caminho (sem a query), já sem acento e com 0→o e 1→l. São radicais:
  # "atualiza" pega "atualizar" e "atualizacao".
  palavras_isca:
    - 'segurança'
    - 'atualiza'
    - 'regulariz'
    - 'verifica'
    - 'login'
    - 'libera'
    - 'taxa'

  # Porta explícita fora destas é truque de endereço.
  portas_comuns: [80, 443]

  # Subdomínios antes do domínio registrável, sem contar o "www".
  subdominios_suspeitos_a_partir_de: 3

  # ADR-0004 §3: distância de edição proporcional ao tamanho do nome da marca. Nome com menos
  # de 4 letras (bb, gov) não entra: a uma letra de distância casaria com metade da internet.
  semelhanca:
    minimo_de_letras: 4
    curto_ate: 6
    distancia_curto: 1
    distancia_longo: 2

  # `nomes`: como o endereço escreve a marca, comparado com cada pedaço do host separado por
  # "." ou "-" (e com o rótulo inteiro sem hífen). Pedaço inteiro, não trecho: "inter" não casa
  # com "internet". `semelhanca: false` para nome que é palavra comum.
  # `oficiais`: domínio registrável; cobre os subdomínios (gov.br vale para detran.sp.gov.br).
  marcas:
    - nome: Correios
      nomes: [correios]
      semelhanca: true
      oficiais: [correios.com.br]
    # O gov.br vem antes das outras marcas sob gov.br: num empate de domínio oficial, quem está
    # primeiro é o dono (`www.gov.br/inss` é "oficial do gov.br").
    - nome: gov.br
      nomes: [gov, govbr]
      semelhanca: false
      oficiais: [gov.br]
    - nome: Caixa
      nomes: [caixa, fgts]
      semelhanca: false
      oficiais: [caixa.gov.br, gov.br]
    - nome: INSS
      nomes: [inss, meuinss]
      semelhanca: false
      oficiais: [gov.br]
    - nome: Receita Federal
      nomes: [receita, receitafederal]
      semelhanca: false
      oficiais: [gov.br]
    - nome: Detran
      nomes: [detran]
      semelhanca: true
      oficiais: [gov.br]
    - nome: Banco do Brasil
      nomes: [bb, bancodobrasil]
      semelhanca: false
      oficiais: [bb.com.br]
    - nome: Itaú
      nomes: [itau]
      semelhanca: true
      oficiais: [itau.com.br]
    - nome: Bradesco
      nomes: [bradesco]
      semelhanca: true
      oficiais: [bradesco.com.br]
    - nome: Santander
      nomes: [santander]
      semelhanca: true
      oficiais: [santander.com.br]
    - nome: Nubank
      nomes: [nubank]
      semelhanca: true
      oficiais: [nubank.com.br]
    - nome: Inter
      nomes: [inter, bancointer]
      semelhanca: false
      oficiais: [inter.co, bancointer.com.br]
    - nome: Mercado Pago
      nomes: [mercadopago]
      semelhanca: true
      oficiais: [mercadopago.com.br, mercadopago.com]
    - nome: PicPay
      nomes: [picpay]
      semelhanca: true
      oficiais: [picpay.com]
    - nome: Serasa
      nomes: [serasa]
      semelhanca: true
      oficiais: [serasa.com.br, serasaexperian.com.br]
    - nome: WhatsApp
      nomes: [whatsapp]
      semelhanca: true
      oficiais: [whatsapp.com, wa.me]
    - nome: Instagram
      nomes: [instagram]
      semelhanca: true
      oficiais: [instagram.com]

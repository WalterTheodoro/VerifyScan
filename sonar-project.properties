# Analise estatica no SonarQube Cloud (ADR-0027). Quem roda e o job "sonar" do CI; a analise
# automatica do SonarQube Cloud fica desligada.
# Sem acentos de proposito: arquivo .properties nem sempre e lido como UTF-8.

sonar.organization=waltertheodoro
sonar.projectKey=WalterTheodoro_VerifyScan
sonar.projectName=VerifyScan
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# --- O que e analisado -------------------------------------------------------------------------
# Codigo: o backend (app/), o frontend e os workflows do CI. O corpus/ fica fora: e dado de teste.
sonar.sources=backend/app,frontend,.github
sonar.tests=backend/tests,frontend
sonar.test.inclusions=backend/tests/**,frontend/**/*.test.ts,frontend/**/*.test.tsx
# Fora das fontes: os testes do frontend (entram acima, como teste) e o que e gerado ou instalado.
sonar.exclusions=frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/node_modules/**,frontend/.next/**,frontend/coverage/**,frontend/next-env.d.ts

# --- Cobertura ---------------------------------------------------------------------------------
# Importada dos relatorios que o CI gera; o Sonar nao roda teste.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Igual ao que medimos (ADR-0025). Backend: app/ inteiro, sem excecao. Frontend: so app/**, entao
# o que mora na raiz do frontend (proxy.ts, instrumentation*.ts, next.config.ts, configs) nao conta.
sonar.coverage.exclusions=frontend/*.ts,frontend/*.mjs,.github/**

# --- Questoes aceitas ou falso positivo --------------------------------------------------------
# Cada linha: uma regra num arquivo, nunca a regra no projeto inteiro. A tabela completa da
# triagem, com a justificativa, esta no ADR-0027.
sonar.issue.ignore.multicriteria=a1,a2,a3,a4,a5,a6,a7,a8,a9,a10,a11

# uv sem --no-build: o proprio backend e um pacote que precisa ser construido.
sonar.issue.ignore.multicriteria.a1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.a1.resourceKey=.github/workflows/ci.yml

# Senha do Postgres do CI: descartavel, o banco so existe dentro do runner.
sonar.issue.ignore.multicriteria.a2.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.a2.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.a3.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.a3.resourceKey=.github/workflows/ci.yml

# Senha no default do database_url: e a do docker compose local; producao usa a variavel.
sonar.issue.ignore.multicriteria.a4.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.a4.resourceKey=backend/app/core/config.py

# "http://" so como prefixo para separar o host; o sistema nunca abre o link (ADR-0022).
sonar.issue.ignore.multicriteria.a5.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.a5.resourceKey=backend/app/analyzers/urls.py
sonar.issue.ignore.multicriteria.a6.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.a6.resourceKey=backend/app/analyzers/dominios.py

# Regex que tira a barra do fim: a entrada e variavel de ambiente nossa, nao de visitante.
sonar.issue.ignore.multicriteria.a7.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.a7.resourceKey=frontend/app/_lib/servidor.ts
sonar.issue.ignore.multicriteria.a8.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.a8.resourceKey=frontend/next.config.ts

# try em volta de fetch().catch(): o try pega o fetch que lanca na hora, o catch pega a rejeicao.
sonar.issue.ignore.multicriteria.a9.ruleKey=typescript:S4822
sonar.issue.ignore.multicriteria.a9.resourceKey=frontend/app/_lib/servidor.ts

# Mesma expressao dos dois lados do assert: sao duas chamadas, o teste e que o sorteio se repete.
sonar.issue.ignore.multicriteria.a10.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.a10.resourceKey=backend/tests/test_sortear_divisao.py

# CORS nao e o ultimo middleware: o de requisicao fica por fora de proposito (ADR-0026).
sonar.issue.ignore.multicriteria.a11.ruleKey=python:S8414
sonar.issue.ignore.multicriteria.a11.resourceKey=backend/app/main.py
